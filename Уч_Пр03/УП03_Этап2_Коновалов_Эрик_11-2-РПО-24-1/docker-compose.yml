services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vetcare-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - FLASK_DEBUG=0
      - DATABASE_URL=sqlite:///instance/vetcare.db
      - SECRET_KEY=change-me-in-production
    volumes:
      - vetcare_data:/app/instance
      - vetcare_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  vetcare_data:
    driver: local
  vetcare_logs:
    driver: local