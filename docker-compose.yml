services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vetcare-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - FLASK_DEBUG=0
      - DATABASE_URL=sqlite:////tmp/vetcare.db
      - SECRET_KEY=change-me-in-production

volumes: {}