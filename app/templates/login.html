{% extends "base.html" %}
{% block content %}
<h2>Вход в систему</h2>
<form method="POST" style="max-width: 400px;">
    <label for="username"><strong>Логин:</strong></label><br>
    <input type="text" id="username" name="username" required
        style="width: 100%; padding: 10px; margin: 5px 0 15px; border: 1px solid #ccc; border-radius: 4px;"><br>

    <label for="password"><strong>Пароль:</strong></label><br>
    <input type="password" id="password" name="password"
        style="width: 100%; padding: 10px; margin: required 5px 0 15px; border: 1px solid #ccc; border-radius: 4px;"><br>

    <button type="submit" class="btn">Войти</button>
</form>
<p style="margin-top: 20px;">
    Нет аккаунта? <a href="{{ url_for('register') }}">Зарегистрироваться</a> (только для администратора)
</p>
{% endblock %}
